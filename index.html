<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="src/css/style.css"/>
  <title>BasicCalc</title>
</head>
<body>
  <div id="container">
    <header>
      <h1>BasicCalc</h1>
    </header>
    <section id="operations">
      <div class="operation" data-operation="sum">
        <input type="number" placeholder="A" />
        <button>+</button>
        <input type="number" placeholder="B" />
        <span class="symbol">=</span>
        <span class="result">x</span>
      </div>
      <div class="operation" data-operation="subtract">
        <input type="number" placeholder="A" />
        <button>-</button>
        <input type="number" placeholder="B" />
        <span class="symbol">=</span>
        <span class="result">x</span>
      </div>
      <div class="operation" data-operation="multiply">
        <input type="number" placeholder="A" />
        <button>x</button>
        <input type="number" placeholder="B" />
        <span class="symbol">=</span>
        <span class="result">x</span>
      </div>
      <div class="operation" data-operation="division">
        <input type="number" placeholder="A" />
        <button>/</button>
        <input type="number" placeholder="B" />
        <span class="symbol">=</span>
        <span class="result">x</span>
      </div>
    </section>
  </div>
  <script src="src/javascript/script.js"></script>
</body>
</html>
